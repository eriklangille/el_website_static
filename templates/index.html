{% extends "base.html" %}
{% block content %}
<section id="blog">
  {% for post in posts %}
  <article>
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    <time datetime="{{ post.date_iso }}">{{ post.date }}</time>
    <p>{{ post.description }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
