{% extends "base.html" %}
{% block title %}{{post.title}}{% endblock %}
{% block description %}{{post.description}}{% endblock %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <time datetime="{{ post.date_iso }}">{{ post.date }}</time>
  <div id="post">
    {{ post.content|safe }}
  </div>
</article>
{% endblock %}
