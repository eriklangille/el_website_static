<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{% if self.title() %}{% block title %}{% endblock %} · {% endif %}Erik Langille</title>
      <meta name="description" content="{% block description %}Erik Langille's blog about programming: Zig, JavaScript engines, API design and more.{% endblock %}">
      <meta property="og:title" content="{% if self.title() %}{{ self.title() }} · {% endif %}Erik Langille">
      <meta property="og:description" content="{{ self.description() }}">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="/assets/code.css" type="text/css" />
      <link rel="stylesheet" href="/assets/style.css" type="text/css" />
  </head>
  <body>
    <header>
      <a href="/" id="site-name" title="Code Comments Home">// Code comments</a>
      <a href="/about" title="About Erik Langille">About</a>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      © Erik Langille ·
      <a href="https://github.com/eriklangille" rel="noreferrer noopener" target="_blank">GitHub</a> ·
      <a href="https://x.com/eriklangille" rel="noreferrer noopener" target="_blank">X</a> ·
      <a href="https://linkedin.com/in/eriklangille" rel="noreferrer noopener" target="_blank">LinkedIn</a>
    </footer>
  </body>
</html>
